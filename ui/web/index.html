<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taaveti UPT — Leaderboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --panel2: #f0f3f6; --border: #d0d7de;
    --text: #1f2328; --muted: #656d76; --green: #1a7f37; --red: #cf222e;
    --accent: #0969da; --gold: #9a6700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  a { color: var(--accent); text-decoration: none; }
  header {
    display: flex; align-items: center; gap: 20px; padding: 16px 24px;
    border-bottom: 1px solid var(--border); background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header h1 .sub { color: var(--muted); font-weight: 400; font-size: 13px; }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  nav button.active { background: var(--panel2); color: var(--text); border-color: var(--border); }
  .container { max-width: 1320px; margin: 0 auto; padding: 24px; }

  /* Leaderboard + sidebar layout */
  .lb-layout { display: flex; gap: 20px; align-items: flex-start; }
  .lb-main { flex: 1; min-width: 0; }
  .lb-side { width: 240px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 14px 6px; position: sticky; top: 88px; }
  .popular-list { display: flex; flex-direction: column; }
  .pop-row { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .pop-row:last-child { border-bottom: none; }
  .pop-row:hover { background: var(--panel2); }
  .pop-t { font-weight: 600; font-size: 13px; }
  .pop-vol { color: var(--muted); font-size: 10px; }
  .pop-px { margin-left: auto; text-align: right; }
  .pop-px .p { font-size: 13px; font-variant-numeric: tabular-nums; }
  .pop-px .c { font-size: 11px; }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .kpi .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .kpi .value.small { font-size: 15px; }
  .chart-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; cursor: pointer; user-select: none; }
  th:hover { color: var(--text); }
  th.num, td.num { text-align: right; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel2); }
  .rank { font-weight: 700; color: var(--muted); width: 30px; }
  .rank.r1 { color: var(--gold); } .rank.r2 { color: #c0c0c0; } .rank.r3 { color: #cd7f32; }
  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 12px; margin-right: 8px; }
  .name-cell { display: flex; align-items: center; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; margin-left: 8px; font-weight: 600; text-transform: uppercase; }
  .badge.ai { background: #ddf4ff; color: #0550ae; }
  .badge.human { background: #fbefff; color: #6639ba; }
  .badge.index { background: #dafbe1; color: #116329; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .spark { width: 90px; height: 26px; }

  /* Drawer */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(27,31,36,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 560px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--border); z-index: 30;
    transform: translateX(100%); transition: transform .25s ease; overflow-y: auto;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
  .drawer-head .close { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
  .drawer-body { padding: 20px 24px; }
  .tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--border); }
  .tabs button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 12px; cursor: pointer; font-size: 13px; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--panel2); border-radius: 6px; padding: 10px 12px; }
  .stat .l { color: var(--muted); font-size: 11px; }
  .stat .v { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .mini-table th, .mini-table td { padding: 7px 10px; font-size: 13px; }
  .filter-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .filter-row button { background: var(--panel2); border: 1px solid var(--border); color: var(--muted); padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .filter-row button.active { color: var(--text); border-color: var(--accent); }
  .reason { color: var(--muted); font-size: 12px; font-style: italic; }
  .section-title { font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; margin: 20px 0 10px; }
  .loading { text-align: center; color: var(--muted); padding: 40px; }
  .trade-form { display: flex; flex-direction: column; gap: 12px; max-width: 340px; }
  .trade-form label { color: var(--muted); font-size: 12px; display: block; margin-bottom: 4px; }
  .trade-form input, .trade-form select {
    width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 6px; font-size: 14px;
  }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel2); color: var(--muted); cursor: pointer; font-weight: 600; }
  .seg button.buy-on { background: #dafbe1; border-color: var(--green); color: var(--green); }
  .seg button.sell-on { background: #ffebe9; border-color: var(--red); color: var(--red); }
  .submit-btn { padding: 10px; border-radius: 6px; border: none; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }
  .trade-msg { font-size: 13px; padding: 8px 10px; border-radius: 6px; }
  .trade-msg.ok { background: #dafbe1; color: var(--green); }
  .trade-msg.err { background: #ffebe9; color: var(--red); }
  .txn-type { font-weight: 700; }
  canvas { max-width: 100%; }
  @media (max-width: 720px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .hide-mobile { display: none; }
    .container { padding: 12px; }
    .lb-layout { flex-direction: column; }
    .lb-side { width: 100%; position: static; }
  }
</style>
</head>
<body>
<header>
  <h1>Taaveti UPT <span class="sub">· trading league</span></h1>
  <nav>
    <button id="nav-lb" class="active" onclick="showView('leaderboard')">Leaderboard</button>
    <button id="nav-act" onclick="showView('activity')">Activity</button>
  </nav>
</header>

<div class="container">
  <!-- LEADERBOARD VIEW -->
  <div id="view-leaderboard" class="lb-layout">
    <div class="lb-main">
    <div class="kpis" id="kpis"></div>
    <div class="chart-card">
      <div class="section-title" style="margin-top:0">Portfolio value over time</div>
      <canvas id="lbChart" height="90"></canvas>
    </div>
    <table id="lb-table">
      <thead>
        <tr>
          <th data-sort="rank" class="num">#</th>
          <th data-sort="username">Player</th>
          <th data-sort="total_value" class="num">Value</th>
          <th data-sort="holdings_value" class="num hide-mobile">Invested</th>
          <th data-sort="cash_balance" class="num hide-mobile">Cash</th>
          <th data-sort="pnl_percent" class="num">Return</th>
          <th data-sort="volatility" class="num hide-mobile">Volatility</th>
          <th data-sort="maxdd" class="num hide-mobile">Max DD</th>
          <th class="hide-mobile">Equity</th>
        </tr>
      </thead>
      <tbody id="lb-body">
        <tr><td colspan="9" class="loading">Loading leaderboard…</td></tr>
      </tbody>
    </table>
    </div>
    <aside class="lb-side">
      <div class="section-title" style="margin-top:0">Popular Stocks</div>
      <div id="popular-list" class="popular-list"><div class="loading">Loading…</div></div>
    </aside>
  </div>

  <!-- ACTIVITY VIEW -->
  <div id="view-activity" style="display:none">
    <div class="section-title">Recent trades across all players</div>
    <table>
      <thead>
        <tr>
          <th>Time</th><th>Player</th><th>Action</th><th>Ticker</th>
          <th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th>
        </tr>
      </thead>
      <tbody id="act-body">
        <tr><td colspan="7" class="loading">Loading activity…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <div id="d-name" style="font-size:18px;font-weight:600"></div>
      <div id="d-sub" style="color:var(--muted);font-size:13px;margin-top:2px"></div>
    </div>
    <button class="close" onclick="closeDrawer()">×</button>
  </div>
  <div class="tabs">
    <button class="active" data-tab="portfolio" onclick="showTab('portfolio')">Portfolio</button>
    <button data-tab="history" onclick="showTab('history')">History</button>
    <button data-tab="performance" onclick="showTab('performance')">Performance</button>
    <button data-tab="trade" id="tab-btn-trade" onclick="showTab('trade')" style="display:none">Trade</button>
  </div>
  <div class="drawer-body">
    <div id="tab-portfolio"></div>
    <div id="tab-history" style="display:none"></div>
    <div id="tab-performance" style="display:none"></div>
    <div id="tab-trade" style="display:none"></div>
  </div>
</div>

<!-- STOCK DRAWER -->
<div class="drawer-overlay" id="stock-overlay" onclick="closeStockDrawer()"></div>
<div class="drawer" id="stock-drawer">
  <div class="drawer-head">
    <div>
      <div id="s-name" style="font-size:18px;font-weight:600"></div>
      <div id="s-sub" style="color:var(--muted);font-size:13px;margin-top:2px"></div>
    </div>
    <button class="close" onclick="closeStockDrawer()">×</button>
  </div>
  <div class="drawer-body" id="stock-body"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt$ = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPct = (n) => (n >= 0 ? '+' : '') + Number(n || 0).toFixed(2) + '%';
const fmtQty = (n) => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 4 });
const cls = (n) => n >= 0 ? 'pos' : 'neg';
const initials = (s) => (s || '?').slice(0, 2).toUpperCase();
const badgeFor = (t) => {
  if (t === 'index_fund') return '<span class="badge index">Index</span>';
  if (t === 'ai' || t === 'llm' || t === 'llm_agent') return '<span class="badge ai">AI</span>';
  return '<span class="badge human">Human</span>';
};

let lbData = [];
let sortKey = 'rank', sortDir = 1;
const riskCache = {}; // username -> {volatility, maxdd, pnl_history}

// ---- Risk metrics computed client-side from pnl_history ----
function computeRisk(pnlHist) {
  const pts = (pnlHist || []).map(p => p.pnl_pct).filter(v => v != null);
  if (pts.length < 2) return { volatility: 0, maxdd: 0 };
  // period returns from pnl% series (relative to starting value baseline)
  const rets = [];
  for (let i = 1; i < pts.length; i++) rets.push((pts[i] - pts[i - 1]));
  const mean = rets.reduce((a, b) => a + b, 0) / rets.length;
  const variance = rets.reduce((a, b) => a + (b - mean) ** 2, 0) / rets.length;
  const volatility = Math.sqrt(variance);
  // max drawdown on equity (1 + pnl%/100)
  let peak = -Infinity, maxdd = 0;
  for (const v of pts) {
    const eq = 1 + v / 100;
    if (eq > peak) peak = eq;
    const dd = (peak - eq) / peak * 100;
    if (dd > maxdd) maxdd = dd;
  }
  return { volatility, maxdd };
}

async function fetchRisk(username) {
  if (riskCache[username]) return riskCache[username];
  try {
    const d = await (await fetch(`/api/agent-detail/${username}`)).json();
    const r = computeRisk(d.pnl_history);
    riskCache[username] = { ...r, pnl_history: d.pnl_history, detail: d };
  } catch { riskCache[username] = { volatility: 0, maxdd: 0, pnl_history: [] }; }
  return riskCache[username];
}

// ---- Sparkline ----
function sparkline(pnlHist) {
  const pts = (pnlHist || []).map(p => p.pnl_pct).filter(v => v != null);
  if (pts.length < 2) return '<span style="color:var(--muted)">—</span>';
  const w = 90, h = 26, min = Math.min(...pts), max = Math.max(...pts);
  const range = max - min || 1;
  const coords = pts.map((v, i) => {
    const x = (i / (pts.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const color = pts[pts.length - 1] >= pts[0] ? 'var(--green)' : 'var(--red)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}

// ---- Leaderboard ----
async function loadLeaderboard() {
  const data = await (await fetch('/api/leaderboard')).json();
  lbData = data;
  renderKPIs(data);
  renderTable();
  renderLbChart();
  loadPopular();
  // lazily load risk + sparklines
  for (const row of data) {
    fetchRisk(row.username).then(() => { renderTable(); });
  }
}

const LB_COLORS = ['#0969da','#1a7f37','#9a6700','#cf222e','#8250df','#0550ae','#116329','#bc4c00','#a40e26','#953800'];
let lbChart = null;
async function renderLbChart() {
  const el = $('lbChart');
  if (!el) return;
  try {
    const { history, users } = await (await fetch('/api/portfolio-history')).json();
    const uids = Object.keys(history);
    if (!uids.length) { el.parentElement.querySelector('.section-title').insertAdjacentHTML('afterend', ''); return; }
    // Union of all timestamps for a shared x-axis.
    const allTimes = [...new Set(uids.flatMap(u => history[u].map(p => p.time)))].sort();
    const labels = allTimes.map(t => new Date(t).toLocaleDateString());
    const datasets = uids.map((u, i) => {
      const byTime = Object.fromEntries(history[u].map(p => [p.time, p.value]));
      let last = null;
      const data = allTimes.map(t => { if (byTime[t] != null) last = byTime[t]; return last; });
      const color = LB_COLORS[i % LB_COLORS.length];
      return { label: users[u] || u, data, borderColor: color, backgroundColor: 'transparent', tension: .25, pointRadius: 0, borderWidth: 2, spanGaps: true };
    });
    const prev = Chart.getChart('lbChart');
    if (prev) prev.destroy();
    lbChart = new Chart(el, {
      type: 'line',
      data: { labels, datasets },
      options: {
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'top', labels: { color: '#1f2328', boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { label: c => `${c.dataset.label}: $${Number(c.parsed.y).toLocaleString('en-US',{maximumFractionDigits:0})}` } } },
        scales: {
          x: { ticks: { color: '#656d76', maxTicksLimit: 8 }, grid: { color: '#d0d7de' } },
          y: { ticks: { color: '#656d76', callback: v => '$' + Number(v).toLocaleString('en-US',{maximumFractionDigits:0}) }, grid: { color: '#d0d7de' } }
        }
      }
    });
  } catch (e) { console.error('leaderboard chart failed', e); }
}

async function loadPopular() {
  const el = $('popular-list');
  if (!el) return;
  try {
    const data = await (await fetch('/api/watchlist?limit=100')).json();
    const top = data
      .filter(s => s.price)
      .sort((a, b) => (b.volume || 0) - (a.volume || 0))
      .slice(0, 20);
    if (!top.length) { el.innerHTML = '<div class="loading">No data.</div>'; return; }
    el.innerHTML = top.map(s => {
      const ch = s.change_percent || 0;
      const vol = s.volume ? (s.volume >= 1e6 ? (s.volume / 1e6).toFixed(1) + 'M' : (s.volume / 1e3).toFixed(0) + 'K') : '';
      return `<div class="pop-row" onclick="openDrawerTicker('${s.ticker}')">
        <div><div class="pop-t">${s.ticker}</div><div class="pop-vol">Vol ${vol}</div></div>
        <div class="pop-px"><div class="p">${fmt$(s.price)}</div><div class="c ${cls(ch)}">${fmtPct(ch)}</div></div>
      </div>`;
    }).join('');
  } catch (e) { console.error('popular stocks failed', e); el.innerHTML = '<div class="loading">Unavailable.</div>'; }
}

let stockChart = null;
async function openDrawerTicker(ticker) {
  $('stock-overlay').classList.add('open');
  $('stock-drawer').classList.add('open');
  $('s-name').textContent = ticker;
  $('s-sub').textContent = 'Loading…';
  $('stock-body').innerHTML = '<div class="loading">Loading…</div>';
  try {
    const d = await (await fetch(`/api/stock/${ticker}`)).json();
    const ch = d.change_percent || 0;
    const company = (d.company && d.company !== d.ticker) ? d.company : '';
    const sector = (d.sector && d.sector !== 'Unknown') ? d.sector : '';
    const subBits = [company, sector].filter(Boolean).join(' · ');
    $('s-name').textContent = d.ticker;
    $('s-sub').innerHTML = `${subBits ? subBits + ' · ' : ''}<strong>${fmt$(d.price)}</strong> <span class="${cls(ch)}">${fmtPct(ch)}</span>`;

    const holders = (d.holders || []).map(h => `<tr>
      <td>${h.username}${badgeFor(h.user_type)}</td>
      <td class="num">${fmtQty(h.quantity)}</td>
      <td class="num">${fmt$(h.avg_cost)}</td>
      <td class="num ${cls(h.pnl_percent)}">${fmtPct(h.pnl_percent)}</td>
    </tr>`).join('');

    const trades = (d.recent_trades || []).map(t => `<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;font-size:13px">
      <span class="txn-type ${t.transaction_type === 'BUY' ? 'pos' : 'neg'}">${t.transaction_type}</span>
      <strong>${t.username}</strong>
      <span style="color:var(--muted)">${fmtQty(t.quantity)} @ ${fmt$(t.price_per_share)}</span>
      <span style="margin-left:auto;color:var(--muted);font-size:11px">${t.executed_at ? new Date(t.executed_at).toLocaleDateString() : ''}</span>
    </div>`).join('');

    const news = (d.news || []).map(n => `<div style="padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:13px">${n.title}</div>
      <div style="color:var(--muted);font-size:11px;margin-top:2px">${n.publisher || ''}${n.published_at ? ' · ' + new Date(n.published_at).toLocaleDateString() : ''}</div>
    </div>`).join('');

    $('stock-body').innerHTML = `
      <div class="section-title" style="margin-top:0">Price (14d)</div>
      ${(d.ohlcv && d.ohlcv.length) ? '<canvas id="stockChart" height="200"></canvas>' : '<div class="loading">No price history.</div>'}
      <div class="section-title">Holders</div>
      ${holders ? `<table class="mini-table"><thead><tr><th>Player</th><th class="num">Qty</th><th class="num">Avg</th><th class="num">P&L</th></tr></thead><tbody>${holders}</tbody></table>` : '<div class="loading">No holders yet.</div>'}
      <div class="section-title">Recent trades</div>
      ${trades || '<div class="loading">No trades in this ticker.</div>'}
      <div class="section-title">News</div>
      ${news || '<div class="loading">No recent news.</div>'}`;

    if (d.ohlcv && d.ohlcv.length) {
      const prev = Chart.getChart('stockChart');
      if (prev) prev.destroy();
      const labels = d.ohlcv.map(o => new Date(o.date).toLocaleDateString());
      const closes = d.ohlcv.map(o => o.close);
      const up = closes[closes.length - 1] >= closes[0];
      try {
        stockChart = new Chart($('stockChart'), {
          type: 'line',
          data: { labels, datasets: [{ data: closes, borderColor: up ? '#1a7f37' : '#cf222e', backgroundColor: 'transparent', tension: .25, pointRadius: 0, borderWidth: 2 }] },
          options: {
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#656d76', maxTicksLimit: 6 }, grid: { color: '#d0d7de' } },
              y: { ticks: { color: '#656d76', callback: v => '$' + Number(v).toFixed(0) }, grid: { color: '#d0d7de' } }
            }
          }
        });
      } catch (e) { console.error('stock chart failed', e); }
    }
  } catch (e) {
    console.error('openDrawerTicker failed:', e);
    $('s-sub').textContent = '';
    $('stock-body').innerHTML = `<div class="loading">Failed to load: ${e.message}</div>`;
  }
}
function closeStockDrawer() {
  $('stock-overlay').classList.remove('open');
  $('stock-drawer').classList.remove('open');
}

function renderKPIs(data) {
  const best = data.reduce((a, b) => (b.pnl_percent > a.pnl_percent ? b : a), data[0]);
  const worst = data.reduce((a, b) => (b.pnl_percent < a.pnl_percent ? b : a), data[0]);
  $('kpis').innerHTML = `
    <div class="kpi"><div class="label">Players</div><div class="value">${data.length}</div></div>
    <div class="kpi"><div class="label">Best</div><div class="value small">${best.username} <span class="${cls(best.pnl_percent)}">${fmtPct(best.pnl_percent)}</span></div></div>
    <div class="kpi"><div class="label">Worst</div><div class="value small">${worst.username} <span class="${cls(worst.pnl_percent)}">${fmtPct(worst.pnl_percent)}</span></div></div>
    <div class="kpi"><div class="label">Avg Return</div><div class="value ${cls(data.reduce((a,b)=>a+b.pnl_percent,0)/data.length)}">${fmtPct(data.reduce((a,b)=>a+b.pnl_percent,0)/data.length)}</div></div>`;
}

function renderTable() {
  const rows = [...lbData].sort((a, b) => {
    let av, bv;
    if (sortKey === 'volatility' || sortKey === 'maxdd') {
      av = (riskCache[a.username] || {})[sortKey] ?? 0;
      bv = (riskCache[b.username] || {})[sortKey] ?? 0;
    } else { av = a[sortKey]; bv = b[sortKey]; }
    if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
    return (av - bv) * sortDir;
  });
  $('lb-body').innerHTML = rows.map(r => {
    const risk = riskCache[r.username] || {};
    return `<tr onclick="openDrawer('${r.username}')">
      <td class="num rank r${r.rank}">${r.rank}</td>
      <td><div class="name-cell"><span class="avatar">${initials(r.username)}</span>${r.username}${badgeFor(r.user_type)}</div></td>
      <td class="num">${fmt$(r.total_value)}</td>
      <td class="num hide-mobile">${fmt$(r.holdings_value)}</td>
      <td class="num hide-mobile">${fmt$(r.cash_balance)}</td>
      <td class="num ${cls(r.pnl_percent)}">${fmtPct(r.pnl_percent)}</td>
      <td class="num hide-mobile">${risk.volatility != null ? risk.volatility.toFixed(2) + '%' : '…'}</td>
      <td class="num hide-mobile neg">${risk.maxdd != null ? '-' + risk.maxdd.toFixed(2) + '%' : '…'}</td>
      <td class="hide-mobile">${risk.pnl_history ? sparkline(risk.pnl_history) : ''}</td>
    </tr>`;
  }).join('');
}

document.querySelectorAll('#lb-table th[data-sort]').forEach(th => {
  th.onclick = () => {
    const k = th.dataset.sort;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = k === 'username' ? 1 : (k === 'rank' ? 1 : -1); }
    renderTable();
  };
});

// ---- Activity ----
async function loadActivity() {
  const data = await (await fetch('/api/transactions?limit=50')).json();
  $('act-body').innerHTML = data.length ? data.map(t => `
    <tr>
      <td class="hide-mobile">${new Date(t.executed_at).toLocaleString()}</td>
      <td>${t.username}</td>
      <td class="${t.transaction_type === 'BUY' ? 'pos' : 'neg'} txn-type">${t.transaction_type}</td>
      <td>${t.ticker}</td>
      <td class="num">${fmtQty(t.quantity)}</td>
      <td class="num">${fmt$(t.price_per_share)}</td>
      <td class="num">${fmt$(t.total_value)}</td>
    </tr>`).join('') : '<tr><td colspan="7" class="loading">No transactions yet.</td></tr>';
}

// ---- Views ----
function showView(v) {
  $('view-leaderboard').style.display = v === 'leaderboard' ? 'block' : 'none';
  $('view-activity').style.display = v === 'activity' ? 'block' : 'none';
  $('nav-lb').classList.toggle('active', v === 'leaderboard');
  $('nav-act').classList.toggle('active', v === 'activity');
  if (v === 'activity') loadActivity();
}

// ---- Drawer ----
let currentDetail = null, perfChart = null;
async function openDrawer(username) {
  $('overlay').classList.add('open');
  $('drawer').classList.add('open');
  $('d-name').textContent = username;
  $('d-sub').textContent = 'Loading…';
  $('tab-portfolio').innerHTML = '<div class="loading">Loading…</div>';
  showTab('portfolio');
  try {
    const cached = riskCache[username] && riskCache[username].detail;
    const d = cached || await (await fetch(`/api/agent-detail/${username}`)).json();
    if (!d || !d.portfolio) throw new Error('No portfolio data in response');
    currentDetail = d;
    const p = d.portfolio;
    $('d-name').innerHTML = `${username} ${badgeFor(d.user_type)}`;
    $('d-sub').innerHTML = `${fmt$(p.total_value)} · <span class="${cls(p.pnl_percent)}">${fmtPct(p.pnl_percent)}</span>`;
    renderPortfolio(d);
    renderHistory(d);
    renderTrade(d);
    $('tab-btn-trade').style.display = d.user_type === 'human' ? 'inline-block' : 'none';
  } catch (e) {
    console.error('openDrawer failed:', e);
    $('d-sub').textContent = '';
    $('tab-portfolio').innerHTML = `<div class="loading">Failed to load: ${e.message}</div>`;
  }
}
function closeDrawer() {
  $('overlay').classList.remove('open');
  $('drawer').classList.remove('open');
}
function showTab(t) {
  ['portfolio', 'history', 'performance', 'trade'].forEach(x => {
    $('tab-' + x).style.display = x === t ? 'block' : 'none';
    const btn = document.querySelector(`.tabs button[data-tab="${x}"]`);
    if (btn) btn.classList.toggle('active', x === t);
  });
  if (t === 'performance' && currentDetail) renderPerformance(currentDetail);
}

function renderPortfolio(d) {
  const p = d.portfolio, s = d.stats;
  const holdings = (p.holdings || []).map(h => {
    const weight = p.total_value > 0 ? (h.market_value / p.total_value * 100) : 0;
    return `<tr>
      <td>${h.ticker}</td><td class="num">${fmtQty(h.quantity)}</td>
      <td class="num">${fmt$(h.average_cost)}</td><td class="num">${fmt$(h.current_price)}</td>
      <td class="num">${fmt$(h.market_value)}</td>
      <td class="num ${cls(h.pnl)}">${fmt$(h.pnl)} (${fmtPct(h.pnl_percent)})</td>
      <td class="num">${weight.toFixed(1)}%</td>
    </tr>`;
  }).join('');
  $('tab-portfolio').innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="l">Cash</div><div class="v">${fmt$(p.cash_balance)}</div></div>
      <div class="stat"><div class="l">Holdings</div><div class="v">${fmt$(p.holdings_value)}</div></div>
      <div class="stat"><div class="l">Realized P&L</div><div class="v ${cls(p.realized_pnl)}">${fmt$(p.realized_pnl)}</div></div>
      <div class="stat"><div class="l">Win Rate</div><div class="v">${s.win_rate}%</div></div>
      <div class="stat"><div class="l">Total Trades</div><div class="v">${s.total_trades}</div></div>
      <div class="stat"><div class="l">Largest Trade</div><div class="v">${fmt$(s.largest_trade)}</div></div>
    </div>
    <div class="section-title">Holdings (${p.holdings_count})</div>
    ${holdings ? `<table class="mini-table"><thead><tr><th>Ticker</th><th class="num">Qty</th><th class="num">Avg</th><th class="num">Price</th><th class="num">Value</th><th class="num">P&L</th><th class="num">Wt</th></tr></thead><tbody>${holdings}</tbody></table>` : '<div class="loading">No open positions.</div>'}
    <div class="section-title">Sector Allocation</div>
    <div style="max-width:320px;margin:0 auto"><canvas id="sectorChart"></canvas></div>`;
  renderSectorChart(d.sectors);
}

let sectorChart = null;
function renderSectorChart(sectors) {
  const labels = Object.keys(sectors || {}), vals = Object.values(sectors || {});
  const el = $('sectorChart');
  if (!el) return;
  if (!labels.length) { el.parentElement.innerHTML = '<div class="loading">No sector data.</div>'; return; }
  try {
    const prev = Chart.getChart('sectorChart');
    if (prev) prev.destroy();
    sectorChart = new Chart(el, {
    type: 'doughnut',
    data: { labels, datasets: [{ data: vals, backgroundColor: ['#0969da','#1a7f37','#9a6700','#cf222e','#8250df','#0550ae','#116329','#bc4c00','#a40e26'] }] },
    options: { plugins: { legend: { position: 'right', labels: { color: '#1f2328', boxWidth: 12, font: { size: 11 } } } } }
  });
  } catch (e) { console.error('sector chart failed', e); el.parentElement.innerHTML = '<div class="loading">Chart unavailable.</div>'; }
}

let histFilter = 'ALL';
function renderHistory(d) {
  const trades = (d.trades || []).filter(t => histFilter === 'ALL' || t.action === histFilter);
  $('tab-history').innerHTML = `
    <div class="filter-row">
      ${['ALL', 'BUY', 'SELL'].map(f => `<button class="${histFilter === f ? 'active' : ''}" onclick="setHistFilter('${f}')">${f}</button>`).join('')}
    </div>
    ${trades.length ? trades.map(t => `
      <div style="padding:10px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;gap:8px;align-items:center">
          <span class="txn-type ${t.action === 'BUY' ? 'pos' : 'neg'}">${t.action}</span>
          <strong>${t.ticker}</strong>
          <span style="color:var(--muted)">${fmtQty(t.quantity)} @ ${fmt$(t.price)}</span>
          <span style="margin-left:auto">${fmt$(t.total)}</span>
        </div>
        <div style="color:var(--muted);font-size:11px;margin-top:3px">${t.time ? new Date(t.time).toLocaleString() : ''}</div>
        ${t.reasoning ? `<div class="reason">${t.reasoning}</div>` : ''}
      </div>`).join('') : '<div class="loading">No trades.</div>'}`;
}
function setHistFilter(f) { histFilter = f; renderHistory(currentDetail); }

function renderPerformance(d) {
  const hist = d.pnl_history || [];
  $('tab-performance').innerHTML = hist.length
    ? '<div class="section-title">Return over time (%)</div><canvas id="perfChart" height="220"></canvas>'
    : '<div class="loading">No performance history yet.</div>';
  if (!hist.length) return;
  const prev = Chart.getChart('perfChart');
  if (prev) prev.destroy();
  const labels = hist.map(h => new Date(h.time).toLocaleDateString());
  const vals = hist.map(h => h.pnl_pct);
  const up = vals[vals.length - 1] >= 0;
  try {
  perfChart = new Chart($('perfChart'), {
    type: 'line',
    data: { labels, datasets: [{ data: vals, borderColor: up ? '#1a7f37' : '#cf222e', backgroundColor: 'transparent', tension: .25, pointRadius: 0, borderWidth: 2 }] },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#656d76', maxTicksLimit: 6 }, grid: { color: '#d0d7de' } },
        y: { ticks: { color: '#656d76', callback: v => v + '%' }, grid: { color: '#d0d7de' } }
      }
    }
  });
  } catch (e) { console.error('perf chart failed', e); $('tab-performance').innerHTML = '<div class="loading">Chart unavailable.</div>'; }
}

let tradeAction = 'BUY';
function renderTrade(d) {
  const holdings = d.portfolio.holdings || [];
  const holdOpts = holdings.map(h => `<option value="${h.ticker}">${h.ticker} (${fmtQty(h.quantity)} @ ${fmt$(h.current_price)})</option>`).join('');
  $('tab-trade').innerHTML = `
    <div class="trade-form">
      <div class="seg">
        <button id="seg-buy" class="buy-on" onclick="setTradeAction('BUY')">Buy</button>
        <button id="seg-sell" onclick="setTradeAction('SELL')">Sell</button>
      </div>
      <div>
        <label>Ticker</label>
        <input id="trade-ticker" placeholder="e.g. AAPL" list="hold-list" autocomplete="off" />
        <datalist id="hold-list">${holdOpts}</datalist>
      </div>
      <div>
        <label>Amount (USD)</label>
        <input id="trade-amount" type="number" min="1" step="1" placeholder="500" />
      </div>
      <button class="submit-btn" id="trade-submit" onclick="submitTrade('${d.username}')">Place order</button>
      <div id="trade-msg"></div>
      <div style="color:var(--muted);font-size:11px">Guardrails apply: 30% max single position, no shorting/leverage.</div>
    </div>`;
  setTradeAction('BUY');
}
function setTradeAction(a) {
  tradeAction = a;
  const buy = $('seg-buy'), sell = $('seg-sell');
  if (buy) buy.className = a === 'BUY' ? 'buy-on' : '';
  if (sell) sell.className = a === 'SELL' ? 'sell-on' : '';
}
async function submitTrade(username) {
  const ticker = ($('trade-ticker').value || '').trim().toUpperCase();
  const amount = parseFloat($('trade-amount').value);
  const msg = $('trade-msg'), btn = $('trade-submit');
  if (!ticker || !amount || amount <= 0) {
    msg.className = 'trade-msg err'; msg.textContent = 'Enter a ticker and a positive USD amount.'; return;
  }
  btn.disabled = true; msg.className = 'trade-msg'; msg.textContent = 'Placing…';
  try {
    const res = await fetch('/api/trade', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, ticker, action: tradeAction, amount_dollars: amount })
    });
    const j = await res.json();
    if (res.ok && j.ok) {
      const t = j.transaction;
      msg.className = 'trade-msg ok';
      msg.textContent = `${t.action} ${fmtQty(t.quantity)} ${t.ticker} @ ${fmt$(t.price)} = ${fmt$(t.total)}`;
      $('trade-amount').value = '';
      delete riskCache[username];
      const fresh = await (await fetch(`/api/agent-detail/${username}`)).json();
      currentDetail = fresh; renderPortfolio(fresh); renderHistory(fresh); renderTrade(fresh);
      $('d-sub').innerHTML = `${fmt$(fresh.portfolio.total_value)} · <span class="${cls(fresh.portfolio.pnl_percent)}">${fmtPct(fresh.portfolio.pnl_percent)}</span>`;
      loadLeaderboard();
    } else {
      msg.className = 'trade-msg err'; msg.textContent = j.error || 'Trade rejected.';
    }
  } catch (e) {
    msg.className = 'trade-msg err'; msg.textContent = 'Network error.';
  } finally { btn.disabled = false; }
}

// ---- WebSocket auto-refresh ----
function connectWS() {
  try {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onmessage = () => {
      if ($('view-activity').style.display !== 'none') loadActivity();
      if ($('view-leaderboard').style.display !== 'none') loadLeaderboard();
    };
    ws.onclose = () => setTimeout(connectWS, 5000);
  } catch {}
}

loadLeaderboard();
connectWS();
</script>
</body>
</html>
