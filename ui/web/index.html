<!DOCTYPE html>
<html lang="en" class="h-full bg-[#f8fafc]">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portfolio Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Fira Sans','Inter','system-ui'],mono:['Fira Code','monospace']}}}};</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap');
*{scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
.pu{animation:pu .4s ease-out}@keyframes pu{0%{background:rgba(16,185,129,.12)}100%{transparent}}
.pd{animation:pd .4s ease-out}@keyframes pd{0%{background:rgba(239,68,68,.12)}100%{transparent}}
@keyframes pp{0%,100%{opacity:1}50%{opacity:.35}}.pp{animation:pp 2s infinite}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 1s linear infinite}
.spark{opacity:0;transition:opacity .25s}.spark.done{opacity:1}
.card{transition:all .15s}.card:hover{box-shadow:0 1px 6px rgba(0,0,0,.06)}.card:active{transform:scale(.99)}
.tb{transition:all .15s}
.expandable{max-height:0;overflow:hidden;transition:max-height .3s ease}.expanded{max-height:500px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.modal{background:white;border-radius:12px;padding:20px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.15)}
</style>
</head>
<body class="min-h-screen bg-[#f8fafc] text-[#1e293b] font-sans">

<!-- ═══ HEADER ═══ -->
<header class="h-11 bg-white border-b border-[#e2e8f0] flex items-center justify-between px-5 shrink-0">
  <div class="flex items-center gap-3">
    <span class="text-xs font-semibold text-[#1e40af]">Portfolio Simulator</span>
    <span id="bdg" class="text-[9px] px-2 py-0.5 rounded-full border font-medium text-[#64748b] border-[#cbd5e1]">○ Closed</span>
    <span id="sched-info" class="text-[9px] text-[#94a3b8] hidden"></span>
  </div>
  <div class="flex items-center gap-4 text-[10px]">
    <!-- Agent status dots -->
    <div class="flex items-center gap-3" id="agent-status">
      <span class="flex items-center gap-1"><span id="s-madis" class="w-1.5 h-1.5 rounded-full bg-[#cbd5e1]" title="Madis idle"></span><span class="text-[#94a3b8]">M</span></span>
      <span class="flex items-center gap-1"><span id="s-mari" class="w-1.5 h-1.5 rounded-full bg-[#cbd5e1]" title="Mari idle"></span><span class="text-[#94a3b8]">M</span></span>
    </div>
    <button onclick="toggleDark()" class="text-[#94a3b8] hover:text-[#1e293b] transition cursor-pointer text-sm">🌙</button>
    <button onclick="toggleSettings()" class="text-[#94a3b8] hover:text-[#1e293b] transition cursor-pointer text-sm" title="Settings">⚙️</button>
    <div><span class="text-[#94a3b8]">Eq</span> <span id="eq" class="ml-1 font-semibold text-[#1e293b] font-mono">—</span></div>
    <div><span class="text-[#94a3b8]">Cash</span> <span id="ca" class="ml-1 font-semibold text-[#059669] font-mono">—</span></div>
    <span id="dot" class="w-1.5 h-1.5 rounded-full bg-[#94a3b8]"></span>
  </div>
</header>

<!-- ═══ AGENT DETAIL MODAL ═══ -->
<div id="agent-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeAgentModal()">
  <div class="modal dark:bg-[#1e1e2e] dark:text-[#e4e4e7] max-w-2xl max-h-[85vh] overflow-y-auto" onclick="event.stopPropagation()">
    <div class="flex justify-between items-center mb-3">
      <h3 id="am-title" class="text-sm font-bold"></h3>
      <button onclick="closeAgentModal()" class="text-[#94a3b8] hover:text-[#1e293b] text-lg">×</button>
    </div>
    <div id="am-body"></div>
  </div>
</div>

<!-- ═══ STOCK DETAIL MODAL ═══ -->
<div id="stock-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeStockModal()">
  <div class="modal dark:bg-[#1e1e2e] dark:text-[#e4e4e7] max-w-lg max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
    <div class="flex justify-between items-center mb-3">
      <div><span id="sm-ticker" class="text-sm font-bold text-[#1e293b]"></span> <span id="sm-company" class="text-[10px] text-[#64748b]"></span></div>
      <button onclick="closeStockModal()" class="text-[#94a3b8] hover:text-[#1e293b] text-lg leading-none">×</button>
    </div>
    <div class="flex items-center gap-3 mb-3">
      <span id="sm-price" class="text-lg font-mono font-bold text-[#1e293b]"></span>
      <span id="sm-change" class="text-xs font-mono font-semibold"></span>
      <span id="sm-sector" class="text-[9px] px-2 py-0.5 rounded-full bg-[#f1f5f9] text-[#64748b]"></span>
    </div>
    <canvas id="sm-chart" width="360" height="100" class="w-full mb-3"></canvas>
    <div id="sm-news" class="mb-3"><div class="text-[9px] text-[#94a3b8] uppercase font-semibold mb-1">News</div></div>
    <div id="sm-holders" class="mb-3"><div class="text-[9px] text-[#94a3b8] uppercase font-semibold mb-1">Holders</div></div>
    <div id="sm-trades"><div class="text-[9px] text-[#94a3b8] uppercase font-semibold mb-1">Recent Trades</div></div>
  </div>
</div>
<div id="settings-modal" class="modal-overlay hidden">
  <div class="modal dark:bg-[#1e1e2e]">
    <div class="flex justify-between items-center mb-4"><h3 class="font-semibold text-sm">Settings</h3><button onclick="toggleSettings()" class="text-[#94a3b8] hover:text-[#1e293b] text-lg leading-none">×</button></div>
    <div class="space-y-3 text-xs">
      <div><label class="text-[#64748b] block mb-1">LLM Provider</label><select id="set-provider" class="w-full border border-[#e2e8f0] rounded px-2 py-1.5 bg-white"><option>deepseek</option><option>groq</option><option>ollama</option></select></div>
      <div><label class="text-[#64748b] block mb-1">Cycle Interval (hours)</label><input id="set-interval" type="number" value="3" min="1" max="24" class="w-full border border-[#e2e8f0] rounded px-2 py-1.5"></div>
      <div class="flex items-center justify-between"><span class="text-[#64748b]">Auto-scheduler</span><button id="set-auto" onclick="toggleAuto()" class="px-3 py-1 rounded text-[10px] font-semibold bg-[#10b981]/10 text-[#059669] border border-[#10b981]/30">ON</button></div>
      <div class="flex items-center justify-between"><span class="text-[#64748b]">Notifications</span><button id="set-notify" onclick="toggleNotify()" class="px-3 py-1 rounded text-[10px] font-semibold bg-[#f1f5f9] text-[#64748b] border border-[#e2e8f0]">OFF</button></div>
      <hr class="border-[#e2e8f0]">
      <button onclick="resetPortfolios()" class="w-full py-1.5 text-[10px] font-semibold rounded border border-[#ef4444]/30 bg-[#ef4444]/5 text-[#dc2626] hover:bg-[#ef4444]/10 cursor-pointer">⚠ Reset All Portfolios</button>
    </div>
  </div>
</div>

<div class="flex min-h-[calc(100vh-2.75rem)]">

<!-- LEFT: WATCHLIST + COMPARISON -->
<aside class="w-[250px] border-r border-[#e2e8f0] flex flex-col shrink-0 bg-white min-h-0">
  <div class="p-2 border-b border-[#e2e8f0] flex gap-1">
    <input id="flt" placeholder="Search…" class="flex-1 bg-[#f1f5f9] border border-[#e2e8f0] rounded px-2 py-1.5 text-[10px] placeholder-[#94a3b8] focus:outline-none focus:border-[#3b82f6]">
  </div>
  <div id="wl" class="flex-1 overflow-y-auto"></div>
  <!-- Agent comparison -->
  <div class="border-t border-[#e2e8f0] p-2 bg-[#f8fafc]">
    <div id="compare" class="text-[9px] space-y-1">
      <div class="text-[#94a3b8] uppercase tracking-wider font-semibold mb-1 flex justify-between"><span>Compare</span><button onclick="toggleCompare()" class="text-[#3b82f6]">▼</button></div>
      <div id="compare-body" class="hidden space-y-0.5"></div>
    </div>
  </div>
</aside>

<!-- CENTER -->
<main class="flex-1 flex flex-col min-w-0 bg-[#f8fafc]">
  <div class="mx-4 mt-2.5 bg-white rounded-lg border border-[#e2e8f0] p-2.5">
    <div class="flex justify-between mb-1"><span class="text-[10px] font-semibold text-[#475569]">Portfolio Value</span><div class="flex gap-3 text-[9px]" id="cl"></div></div>
    <canvas id="ch" width="800" height="100" class="w-full"></canvas>
  </div>

  <!-- Tabs -->
  <div class="flex gap-0.5 p-0.5 mx-4 mt-2 bg-[#f1f5f9] rounded-lg border border-[#e2e8f0]">
    <button class="tb flex-1 py-1.5 text-[10px] font-medium rounded border active border-[#3b82f6]/40 bg-white text-[#1e40af] shadow-sm" data-a="madis">Madis</button>
    <button class="tb flex-1 py-1.5 text-[10px] font-medium rounded border border-transparent text-[#64748b] hover:text-[#334155]" data-a="mari">Mari</button>
    <button class="tb flex-1 py-1.5 text-[10px] font-medium rounded border border-transparent text-[#64748b] hover:text-[#334155]" data-a="taavet">Taavet</button>
    <button class="tb flex-1 py-1.5 text-[10px] font-medium rounded border border-transparent text-[#64748b] hover:text-[#334155]" data-a="all">All</button>
  </div>

  <!-- Journal -->
  <div id="journal-container" class="min-h-[200px] mx-4 mt-1.5 bg-white rounded-lg border border-[#e2e8f0]">
    <div id="j-madis" class="journal p-3 space-y-2"><div class="text-[#94a3b8] text-xs text-center py-8">Loading…</div></div>
    <div id="j-mari" class="journal hidden p-3 space-y-2"><div class="text-[#94a3b8] text-xs text-center py-8">Loading…</div></div>
    <div id="j-taavet" class="journal hidden p-3 space-y-2"><div class="text-[#94a3b8] text-xs text-center py-8">Loading…</div></div>
    <div id="j-all" class="journal hidden p-3 space-y-2"></div>
  </div>

  <!-- Chat -->
  <div class="mx-4 mb-2 flex gap-1.5">
    <input id="chat-msg" placeholder="Ask Madis…" class="flex-1 bg-white border border-[#e2e8f0] rounded-lg px-3 py-2 text-[11px] placeholder-[#94a3b8] focus:outline-none focus:border-[#3b82f6]">
    <button onclick="sendChat()" class="px-3 py-2 text-[10px] font-semibold rounded-lg bg-[#3b82f6] text-white hover:bg-[#2563eb] cursor-pointer">Send</button>
    <button onclick="analyze()" class="px-3 py-2 text-[10px] font-semibold rounded-lg bg-[#8b5cf6] text-white hover:bg-[#7c3aed] cursor-pointer">Analyze</button>
  </div>
</main>

<!-- RIGHT: PORTFOLIO + TRADE -->
<aside class="w-[310px] border-l border-[#e2e8f0] flex flex-col shrink-0 bg-white min-h-0">
  <div class="flex items-center justify-between p-2.5 border-b border-[#e2e8f0]">
    <span class="text-[9px] text-[#94a3b8] uppercase tracking-wider font-semibold">Portfolio</span>
    <select id="sort-by" class="text-[9px] bg-[#f1f5f9] border border-[#e2e8f0] rounded px-1.5 py-0.5 text-[#475569] focus:outline-none">
      <option value="pnl">P&L</option><option value="value">Value</option><option value="name">Name</option>
    </select>
  </div>
  <div class="p-2.5 space-y-2" id="pos"></div>

  <!-- Trade panel -->
  <div class="border-t border-[#e2e8f0] p-2.5 space-y-1.5 bg-[#f8fafc]">
    <div id="price-preview" class="hidden text-[10px] text-[#64748b] bg-white rounded p-1.5 border border-[#e2e8f0]"></div>
    <div class="flex gap-1">
      <input id="tt" placeholder="AAPL" maxlength="5" class="flex-1 bg-white border border-[#e2e8f0] rounded px-2 py-1.5 text-[10px] uppercase placeholder-[#94a3b8] focus:outline-none focus:border-[#3b82f6]">
      <input id="ta" type="number" placeholder="500" class="w-[72px] bg-white border border-[#e2e8f0] rounded px-2 py-1.5 text-[10px] placeholder-[#94a3b8] focus:outline-none focus:border-[#3b82f6]">
    </div>
    <div class="flex gap-1">
      <button onclick="tr('BUY')" class="flex-1 py-1.5 text-[9px] font-semibold rounded border border-[#10b981]/30 bg-[#10b981]/5 text-[#059669] hover:bg-[#10b981]/10 cursor-pointer">Buy</button>
      <button onclick="tr('SELL')" class="flex-1 py-1.5 text-[9px] font-semibold rounded border border-[#ef4444]/30 bg-[#ef4444]/5 text-[#dc2626] hover:bg-[#ef4444]/10 cursor-pointer">Sell</button>
    </div>
    <div class="flex gap-1">
      <button onclick="quickBuy()" class="flex-1 py-1 text-[8px] rounded border border-[#e2e8f0] bg-[#f1f5f9] text-[#64748b] hover:bg-[#e2e8f0] cursor-pointer">Buy Max</button>
      <button onclick="quickSell()" class="flex-1 py-1 text-[8px] rounded border border-[#e2e8f0] bg-[#f1f5f9] text-[#64748b] hover:bg-[#e2e8f0] cursor-pointer">Sell All</button>
    </div>
    <button onclick="cy()" class="w-full py-1.5 text-[9px] font-semibold rounded border border-[#3b82f6]/30 bg-[#3b82f6]/5 text-[#2563eb] hover:bg-[#3b82f6]/10 cursor-pointer">Run Cycle</button>
    <button onclick="buildPortfolio()" class="w-full py-1.5 text-[9px] font-semibold rounded border border-[#10b981]/30 bg-[#10b981]/5 text-[#059669] hover:bg-[#10b981]/10 cursor-pointer">🚀 Build Portfolio</button>
    <div id="te" class="hidden text-[9px] text-[#dc2626]"></div>
    <div id="ts" class="hidden text-[9px] text-[#059669]"></div>
  </div>

  <div id="lg" class="border-t border-[#e2e8f0] p-2.5 space-y-1 max-h-[200px] overflow-y-auto">
    <div class="text-[9px] text-[#94a3b8] uppercase tracking-wider font-semibold mb-1 flex justify-between"><span>Recent</span><a href="/api/export/csv" class="text-[#3b82f6] hover:underline">Export</a></div>
  </div>
</aside>
</div>

<script>
const F=n=>(n||0).toLocaleString('en',{minimumFractionDigits:2});
let ws,agent='madis',lb=[],px={},st=Date.now(),sc=0,sq=[],sr=0,allTrades=[],expandedCards={},settings={auto:true,notify:false};

(function c(){ws=new WebSocket(`ws://${location.host}/ws`);ws.onopen=()=>{$('#dot').attr('class','w-1.5 h-1.5 rounded-full bg-[#10b981] pp');init();};ws.onclose=()=>{$('#dot').attr('class','w-1.5 h-1.5 rounded-full bg-[#ef4444]');setTimeout(c,2000);};ws.onmessage=e=>{try{h(JSON.parse(e.data))}catch(_){}};})();

function h(p){
  if(p.type==='INIT'){lb=p.leaderboard||[];PO();if(p.health)badge(p.health.market_open);}
  else if(p.type==='LEADERBOARD_UPDATE'){lb=p.data||[];PO();updateCompare();}
  else if(p.type==='ACCOUNT_STATE_UPDATE'){$('#eq').text('$'+F(p.total_equity));$('#ca').text('$'+F(p.total_cash));badge(p.market_open);}
  else if(p.type==='GATEKEEPER_ALERT'){
    liveTrade(p);
    updateAgentStatus(p.trader,'done');
    setTimeout(()=>updateAgentStatus(p.trader,'idle'),3000);
  }
  else if(p.type==='ANALYSIS_READY'){
    const a=p.agent||'';
    const card=`<div class="card bg-white rounded-lg border border-[#e2e8f0] p-3" style="border-left:4px solid #8b5cf6">
      <div class="flex items-center justify-between mb-2"><span class="text-[11px] font-bold text-[#7c3aed]">📊 ${a.toUpperCase()} Deep Analysis</span><span class="text-[8px] text-[#94a3b8]">${new Date(p.timestamp).toLocaleTimeString()}</span></div>
      <div class="text-[10px] text-[#475569] leading-relaxed whitespace-pre-wrap">${(p.analysis||'').replace(/## /g,'<b>').replace(/\n/g,'<br>')}</div>
    </div>`;
    ['j-'+a,'j-all'].forEach(id=>{const el=$('#'+id);if(el.length)el.prepend(card);});
    updateAgentStatus(a,'done');
  }
}
function badge(o){const b=$('#bdg');o?b.attr('class','text-[9px] px-2 py-0.5 rounded-full border font-medium border-[#10b981]/40 bg-[#10b981]/5 text-[#059669]').text('● Live'):b.attr('class','text-[9px] px-2 py-0.5 rounded-full border font-medium border-[#cbd5e1] text-[#64748b]').text('○ Closed');}
function updateAgentStatus(name,state){
  const el=$('#s-'+name.toLowerCase());
  if(!el.length)return;
  if(state==='thinking')el.attr('class','w-1.5 h-1.5 rounded-full bg-[#f59e0b] pp');
  else if(state==='done')el.attr('class','w-1.5 h-1.5 rounded-full bg-[#10b981]');
  else el.attr('class','w-1.5 h-1.5 rounded-full bg-[#cbd5e1]');
}

async function init(){const p1=LW(),p2=loadAllHistory(),p3=ch();await Promise.all([p1,p2,p3]);PO();updateCompare();
  // Show schedule info
  try{const r=await(await fetch('/api/health')).json();if(r.scheduler?.next_run){
    const secs=Math.max(0,(r.scheduler.next_run*1000-Date.now())/1000);
    $('#sched-info').removeClass('hidden').text(`Next cycle: ${Math.floor(secs/60)}m`).css('color',secs<300?'#d97706':'#94a3b8');
  }}catch(e){}
}

// ── Watchlist ──
async function LW(){try{const d=await(await fetch('/api/watchlist?limit=50')).json();RW(d);sq=d.map(s=>s.ticker);setTimeout(dS,600);}catch(e){}}
function RW(d){const c=$('#wl');if(!d.length){c.html('<div class="text-[10px] text-[#94a3b8] text-center py-4">No data</div>');return;}let h='';d.forEach(s=>{px[s.ticker]=s.price;const ch=s.change_percent||0,cl=ch>=0?'#059669':'#dc2626';h+=`<div class="flex items-center gap-1 px-2 py-1 hover:bg-[#f1f5f9] border-b border-[#f1f5f9] text-[10px] cursor-pointer" data-t="${s.ticker}" onclick="openStockDetail('${s.ticker}')"><div class="flex-1 min-w-0"><div class="font-medium text-[#1e293b] truncate">${s.ticker}</div><div class="text-[8px] text-[#94a3b8] truncate">${(s.company||'').substring(0,15)}</div></div><canvas class="spark" data-tk="${s.ticker}" width="48" height="12"></canvas><div class="text-right shrink-0 w-[48px]"><div id="p-${s.ticker}" class="font-mono font-medium text-[#1e293b]">${s.price?'$'+s.price.toFixed(2):'—'}</div><div class="text-[8px] font-mono font-medium" style="color:${cl}">${ch>=0?'+':''}${ch.toFixed(2)}%</div></div></div>`});c.html(h);}
function quickTrade(ticker){$('#tt').val(ticker);$('#ta').focus();previewPrice();}
async function openStockDetail(ticker){
  $('#stock-modal').removeClass('hidden');
  $('#sm-ticker').text(ticker);$('#sm-company').text('');$('#sm-price').text('Loading…');$('#sm-change').text('');$('#sm-sector').text('');$('#sm-news').html('<div class="text-[9px] text-[#94a3b8] uppercase font-semibold mb-1">News</div>');$('#sm-holders').html('<div class="text-[9px] text-[#94a3b8] uppercase font-semibold mb-1">Holders</div>');$('#sm-trades').html('<div class="text-[9px] text-[#94a3b8] uppercase font-semibold mb-1">Recent Trades</div>');
  try{
    const d=await(await fetch('/api/stock/'+ticker)).json();
    $('#sm-company').text(d.company||'');$('#sm-sector').text(d.sector||'');
    const p=d.price,ch=d.change_percent||0;
    $('#sm-price').text(p?'$'+p.toFixed(2):'N/A');
    $('#sm-change').text((ch>=0?'+':'')+ch.toFixed(2)+'%').css('color',ch>=0?'#059669':'#dc2626');

    // Chart
    if(d.ohlcv&&d.ohlcv.length>1){
      const cv=document.getElementById('sm-chart'),ctx=cv.getContext('2d'),w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);
      const closes=d.ohlcv.map(r=>r.close),mn=Math.min(...closes),mx=Math.max(...closes),rg=mx-mn||0.001;
      ctx.strokeStyle='#e2e8f0';ctx.lineWidth=0.5;
      for(let i=0;i<4;i++){const y=15+(h-25)*(i/3);ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-5,y);ctx.stroke();ctx.fillStyle='#94a3b8';ctx.font='8px Fira Code';ctx.fillText('$'+Math.round(mn+rg*i/3).toLocaleString(),2,y+3);}
      const up=closes[closes.length-1]>=closes[0];ctx.strokeStyle=up?'#10b981':'#ef4444';ctx.lineWidth=1.5;ctx.beginPath();
      closes.forEach((v,i)=>{const x=30+(i/(closes.length-1))*(w-35),y=15+(h-25)*(1-(v-mn)/rg);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
      ctx.stroke();ctx.fillStyle=up?'#10b981':'#ef4444';ctx.beginPath();ctx.arc(30+(closes.length-1)/(closes.length-1)*(w-35),15+(h-25)*(1-(closes[closes.length-1]-mn)/rg),2,0,Math.PI*2);ctx.fill();
    }

    // News
    if(d.news&&d.news.length){let nh='<div class="text-[9px] text-[#94a3b8] uppercase font-semibold mb-1">News</div>';d.news.slice(0,5).forEach(n=>{nh+=`<div class="text-[9px] mb-0.5"><span class="text-[#f59e0b]">${n.publisher||''}</span> <span class="text-[#475569]">${n.title||''}</span></div>`;});$('#sm-news').html(nh);}

    // Holders

async function SS(t){try{const d=await(await fetch(`/api/ohlcv/${t}?days=14`)).json();if(!d||d.length<2)return;const cv=document.querySelector(`canvas[data-tk="${t}"]`);if(!cv)return;const cl=d.map(r=>r.close),mn=Math.min(...cl),mx=Math.max(...cl),rg=mx-mn||0.001;const ctx=cv.getContext('2d'),w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);const up=cl[cl.length-1]>=cl[0];ctx.strokeStyle=up?'#10b98199':'#ef444499';ctx.lineWidth=0.8;ctx.beginPath();cl.forEach((v,i)=>{const x=i/(cl.length-1)*(w-2)+1,y=h-1-((v-mn)/rg)*(h-2);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();ctx.fillStyle=up?'#10b981':'#ef4444';ctx.beginPath();ctx.arc((cl.length-1)/(cl.length-1)*(w-2)+1,h-1-((cl[cl.length-1]-mn)/rg)*(h-2),1,0,Math.PI*2);ctx.fill();cv.classList.add('done');}catch(e){}}

async function sendChat(){const msg=$('#chat-msg').val().trim();if(!msg)return;if(agent==='all'||agent==='taavet'){alert('Chat only for Madis and Mari');return;}const j=$('#j-'+agent);j.append(`<div class="card bg-[#f0f9ff] rounded-lg p-2.5 border border-[#bae6fd] text-[10px]"><b class="text-[#0369a1]">You:</b> ${msg}</div>`);j.append(`<div class="text-[#94a3b8] text-[9px] italic pl-2">${agent} thinking…</div>`);j[0].scrollTop=j[0].scrollHeight;$('#chat-msg').val('');try{const r=await(await fetch('/api/chat/'+agent,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})})).json();j.find('.italic:contains("thinking")').remove();j.append(`<div class="card bg-white rounded-lg p-2.5 border border-[#e2e8f0] text-[10px]"><b class="text-[#1e40af]">${agent.charAt(0).toUpperCase()+agent.slice(1)}:</b> <span class="text-[#475569] leading-relaxed">${(r.response||'Error').replace(/\n/g,'<br>')}</span></div>`);j[0].scrollTop=j[0].scrollHeight;}catch(e){j.find('.italic:contains("thinking")').text('Error');}}
$('#chat-msg').on('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendChat();}});

// ── Trade ──
async function tr(act){
  const tk=$('#tt').val().trim().toUpperCase(),am=parseFloat($('#ta').val()),err=$('#te'),suc=$('#ts');
  err.addClass('hidden').text('');suc.addClass('hidden').text('');
  if(!tk){err.removeClass('hidden').text('Enter symbol');return;}
  if(!am||am<=0){err.removeClass('hidden').text('Enter amount');return;}
  const u=lb.find(r=>r.username==='taavet');if(!u){err.removeClass('hidden').text('No data');return;}
  if(act==='BUY'&&am>u.cash_balance){err.removeClass('hidden').text(`Have $${F(u.cash_balance)}`);return;}
  if(act==='SELL'){const h=u.holdings?.find(h=>h.ticker===tk);if(!h||h.quantity<=0){err.removeClass('hidden').text(`No ${tk}`);return;}}
  if(act==='BUY'&&u.total_value>0&&am/u.total_value>.3){err.removeClass('hidden').text('30% cap');return;}
  try{const r=await(await fetch('/api/trade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker:tk,action:act,amount_dollars:am})})).json();
  if(!r.ok)err.removeClass('hidden').text(r.error||'Rejected');
  else{suc.removeClass('hidden').text(`✓ ${act} ${tk} executed!`);$('#tt').val('');$('#ta').val('');loadAllHistory();ch();PO();setTimeout(()=>suc.addClass('hidden'),5000);}
  }catch(e){err.removeClass('hidden').text('Error');}
}

// ── Build Portfolio ──
async function buildPortfolio(){
  if(!confirm('Agents will build fresh portfolios from scratch. Existing positions will be cleared. Continue?'))return;
  $('#j-all').prepend(`<div class="text-center text-[10px] text-[#10b981] font-semibold py-1">🚀 Building portfolios from scratch…</div>`);
  for(const a of ['madis','mari']){
    $('#j-all').prepend(`<div class="text-center text-[9px] text-[#94a3b8] py-0.5">${a.toUpperCase()} designing portfolio…</div>`);
    try{
      const r=await(await fetch('/api/build-portfolio/'+a,{method:'POST'})).json();
      if(r.trades){
        const card=`<div class="card bg-white rounded-lg border border-[#e2e8f0] p-2.5 mb-2" style="border-left:3px solid #10b981">
          <div class="text-[10px] font-bold text-[#059669] mb-1">🆕 ${a.toUpperCase()} Starting Portfolio</div>
          ${r.trades.map(t=>t.error?`<div class="text-[8px] text-[#dc2626]">❌ ${t.ticker}: ${t.error}</div>`:`<div class="text-[8px] flex justify-between"><span class="font-mono font-medium">${t.ticker}</span><span>${t.allocation} — ${t.shares}×$${t.price.toFixed(2)}</span><span class="font-mono">$${F(t.total)}</span><span class="text-[#94a3b8] truncate w-32">${(t.reasoning||'').substring(0,35)}</span></div>`).join('')}
        </div>`;
        ['j-'+a,'j-all'].forEach(id=>{const el=$('#'+id);if(el.length)el.prepend(card);});
      }
    }catch(e){$('#j-all').prepend(`<div class="text-[9px] text-[#dc2626]">${a} failed: ${e}</div>`);}
  }
  await LW();PO();ch();loadAllHistory();
  $('#j-all').prepend(`<div class="text-center text-[10px] text-[#059669] font-semibold py-1">✅ Portfolios built!</div>`);
}
async function analyze(){
  if(agent==='all'||agent==='taavet'){alert('Analysis for Madis and Mari only.');return;}
  const j=$('#j-'+agent);
  j.prepend(`<div class="text-center text-[10px] text-[#8b5cf6] italic py-2">📊 ${agent.toUpperCase()} is preparing a deep analysis…</div>`);
  j[0].scrollTop=0;
  try{
    const r=await(await fetch('/api/analyze/'+agent,{method:'POST'})).json();
    j.find('.italic:contains("preparing")').remove();
    const card=`<div class="card bg-white rounded-lg border border-[#e2e8f0] p-3 mb-2" style="border-left:4px solid #8b5cf6">
      <div class="flex items-center justify-between mb-2"><span class="text-[11px] font-bold text-[#7c3aed]">📊 ${agent.toUpperCase()} Deep Analysis</span><span class="text-[8px] text-[#94a3b8]">${new Date().toLocaleTimeString()}</span></div>
      <div class="text-[10px] text-[#475569] leading-relaxed whitespace-pre-wrap">${(r.analysis||'Error').replace(/## /g,'<b class=\"text-[#1e293b]\">## ').replace(/\n/g,'<br>')}</div>
    </div>`;
    j.prepend(card);
    $('#j-all').prepend(card);
    j[0].scrollTop=0;
  }catch(e){j.find('.italic:contains("preparing")').text('Error — try again');}
}

// ── Cycle ──
async function cy(){
  sc++;['madis','mari'].forEach(a=>{updateAgentStatus(a,'thinking');});
  $('#j-all').prepend(`<div class="text-center text-[10px] text-[#3b82f6] font-semibold py-1">━━━ Cycle #${sc} — scanning 200 tickers… ━━━</div>`);
  try{const r=await(await fetch('/api/cycle',{method:'POST'})).json();
  if(r.ok){setTimeout(async()=>{await LW();PO();ch();updateCompare();$('#j-all').prepend(`<div class="text-center text-[10px] text-[#059669] py-1">✓ Cycle #${sc} — agents analyzing…</div>`);},6000);}
  }catch(e){}
}

// ── Keyboard ──
$(document).on('keydown',function(e){if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();if(k==='1')$('.tb[data-a="madis"]').click();else if(k==='2')$('.tb[data-a="mari"]').click();else if(k==='3')$('.tb[data-a="taavet"]').click();else if(k==='0')$('.tb[data-a="all"]').click();else if(k==='b'){$('#tt').focus();}else if(k==='c')cy();else if(k==='r'){LW();PO();ch();}});

// ── Dark mode ──
function toggleDark(){const h=document.documentElement;h.classList.toggle('dark');localStorage.setItem('dark',h.classList.contains('dark')?'1':'0');}
if(localStorage.getItem('dark')==='1'){document.documentElement.classList.add('dark');}
if('Notification' in window&&Notification.permission==='default'){setTimeout(()=>Notification.requestPermission(),3000);}

function scrollToTrade(ticker,user){const a=(user||'').toLowerCase();$('.tb').removeClass('active border-[#3b82f6]/40 bg-white text-[#1e40af] shadow-sm').addClass('border-transparent text-[#64748b]');$(`.tb[data-a="${a}"]`).addClass('active border-[#3b82f6]/40 bg-white text-[#1e40af] shadow-sm').removeClass('border-transparent text-[#64748b]');agent=a;$('.journal').addClass('hidden');$('#j-'+a).removeClass('hidden');}

setInterval(()=>{const e=Math.floor((Date.now()-st)/1000);},10000);
