[project]
name = "taaveti-upt"
version = "0.1.0"
description = "Local single-user AI stock portfolio simulator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.15,<5",
    "exchange-calendars>=4.11,<5",
    "fastapi>=0.138,<1",
    "lxml>=6.1,<7",
    "openai>=2.44,<3",
    "pandas>=3.0,<4",
    "python-dotenv>=1.2,<2",
    "requests>=2.34,<3",
    "rich>=15.0,<16",
    "uvicorn>=0.49,<1",
    "yfinance>=1.4,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2.9,<3",
    "pytest>=9.1,<10",
    "pytest-playwright>=0.8,<1",
    "pytest-socket>=0.7,<1",
    "ruff>=0.14,<1",
]
audit = [
    "pip-audit>=2.10,<3",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# SQL, prompts, and Rich markup contain long literals that Ruff cannot safely wrap.
# New application modules should still use the 120-column formatter limit.
ignore = ["E501"]

[tool.uv]
package = false
